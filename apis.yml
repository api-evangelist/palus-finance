name: Palus Finance
description: >-
  Palus Finance is a Y Combinator (Winter 2026) financial-advisory startup that
  acts as a startup's outsourced financial advisor and Registered Investment
  Advisor (RIA) with a fiduciary duty to its clients. Palus automatically manages
  a company's reserve cash and treasury, sweeping idle balances into NVCA-compliant
  bond portfolios built from U.S. government securities and T-Bills to optimize
  yield (targeting roughly a SOFR + 1% spread) while preserving safety and
  liquidity. It connects to a company's existing bank accounts (via Plaid) rather
  than requiring an account switch, sizes allocations against runway and burn rate,
  and can be set up in under ten minutes with no minimums or lockups. Palus is a
  managed, human-plus-software advisory product delivered through its web
  application; it does not currently publish a public developer API, SDKs, or
  developer documentation.
